services:
  # ----------------------------------------------------------------------------
  # Backend API & Real-Time Engine Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chatsphere-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_URL=http://localhost:80
      - JWT_SECRET=chatsphere-super-secure-production-jwt-secret-2026
      - SESSION_SECRET=chatsphere-session-secret-change-in-production-2026
      - MONGO_URI=mongodb://mongo_admin:mongo_password@mongodb:27017/chatsphere?authSource=admin
      - REDIS_URL=redis://redis:6379
      - STORAGE_BUCKET=chatsphere-attachments
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatsphere_data:/app/.data
    networks:
      - chatsphere_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Frontend Static & Nginx Reverse Proxy Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chatsphere-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chatsphere_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # MongoDB Local Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0-jammy
    container_name: chatsphere-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo_admin
      - MONGO_INITDB_ROOT_PASSWORD=mongo_password
      - MONGO_INITDB_DATABASE=chatsphere
    volumes:
      - mongodb_data:/data/db
    networks:
      - chatsphere_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache & Pub/Sub Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chatsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - chatsphere_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chatsphere_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  chatsphere_net:
    driver: bridge
